services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: da-backend
    environment:
      - SERVER_PORT=3001
    volumes:
      - ./auth.db:/app/auth.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: da-one-landing
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
